name: Build OushodhSathi APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Android SDK
        run: |
          test -n "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
      - name: Run pure Java scheduling tests
        run: |
          mkdir -p "$RUNNER_TEMP/oushodhsathi-schedule-tests"
          javac -Xlint:all -d "$RUNNER_TEMP/oushodhsathi-schedule-tests" android-native/app/src/main/java/bd/shantimedicare/oushodhsathi/ScheduleCalculator.java android-native/tests/ScheduleCalculatorTest.java
          java -cp "$RUNNER_TEMP/oushodhsathi-schedule-tests" bd.shantimedicare.oushodhsathi.ScheduleCalculatorTest
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
        working-directory: android-native
      - name: Upload APK (temporary)
        uses: actions/upload-artifact@v4
        with:
          name: oushodhsathi-debug-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
